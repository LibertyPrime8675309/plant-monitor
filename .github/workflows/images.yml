# PLAN.md step 3: build the three container images on GitHub, so Ethan's PC is never the first place a Dockerfile fails.
# Claude's sandbox cannot reach Docker Hub, so until this workflow existed an image was only ever built on his PC.
#
# On a pull request each image is built and thrown away (the build itself is the test). On a push to main the images
# are also pushed to GitHub's registry under this repository, tagged with the release number from VERSION and "latest":
#   ghcr.io/<owner>/plant-database:<version>, ...-vision:<version>, ...-speech:<version>
# The repository and the packages are public (Ethan, November 7, 2026), so a PC pulls them with no login.
# Layers are cached between runs (type=gha), so a run after a small change takes a few minutes, not the twenty the
# picture checker's image takes cold.
name: Images
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plant-database
            dockerfile: Dockerfile
          - name: plant-database-vision
            dockerfile: vision/Dockerfile
          - name: plant-database-speech
            dockerfile: speech/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"   # registry names are lower case
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: PLANTDB_VERSION=${{ steps.ver.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/${{ matrix.name }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
