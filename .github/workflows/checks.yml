# Runs on every pull request and every push to main: the unit tests in seconds, then the browser checks in four parallel
# shards (about 25 minutes each). Nothing here reaches the internet except to install packages: the mock server fakes the
# weather, the picture checker and the stores.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest dev/test/unit -q
      - run: node --check app/static/app.js && node --check app/static/prefs.js && node --check app/static/sw.js
  browser:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - run: python dev/test/run_checks.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-screenshots-${{ strategy.job-index }}
          path: |
            dev/tmp/logs
            dev/tmp/shots
          retention-days: 7
