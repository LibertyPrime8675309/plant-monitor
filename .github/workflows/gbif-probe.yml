# One-off (PLAN.md step 5b): asks GBIF what its country facet looks like, from a runner that can reach it. Removed before merging.
name: gbif-probe
on:
  workflow_dispatch:
    inputs:
      country:
        description: ISO country code
        default: IS
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 dev/vision/gbif_country.py ${{ inputs.country }} --probe
      - run: python3 dev/vision/gbif_country.py ${{ inputs.country }} dev/tmp
      - run: python3 -c "import json;d=json.load(open('dev/tmp/gbif-${{ inputs.country }}.json'));print(len(d));print(sorted(d.items(),key=lambda kv:-kv[1])[:15])"
