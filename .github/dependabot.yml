# 1.57.0: GitHub opens a pull request when a newer version of a library, a base image or a workflow action comes out. Each runs the
# same checks as any pull request; merge it only when they are green, like everything else. Grouped so it is one pull request a week
# per kind, not one per library.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/speech"]                 # the picture checker's libraries are pinned in vision/Dockerfile itself
    schedule: { interval: weekly, day: monday }
    groups: { python: { patterns: ["*"] } }
    ignore:
      # November 11, 2026 (Ethan, closing #107): faster-whisper 1.2.1 passes an option PyAV 19 removed (see speech/requirements.txt),
      # and the speech service is never run by GitHub's checks (they use a stand-in), so a green check would not catch it
      - dependency-name: av
        versions: [">=19"]
  - package-ecosystem: docker
    directories: ["/", "/vision", "/speech"]
    schedule: { interval: weekly, day: monday }
    groups: { images: { patterns: ["*"] } }
    ignore:
      # November 11, 2026 (Ethan, closing #104): a new Python version (3.12 to 3.15) is moved to on purpose, with full testing, not
      # proposed weekly; the speech service's libraries had no build for 3.15 yet. Patch releases inside 3.12 still come in
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ["*"] } }
