<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Looking after the plants | Plant record</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b4b72'/%3E%3Cpath d='M16 27V13M16 17c-5 0-8-3-8-8 5 0 8 3 8 8zm0 4c4 0 7-2.500 7-7-4 0-7 2.500-7 7z' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/share/__TOKEN__/style.css">
</head>
<body class="ps-body sh-body" data-token="__TOKEN__">
<a class="skip" href="#ps-sheet">Skip to the sheet</a>
<main id="ps-main" class="ps-main sh-main" tabindex="-1">
  <div class="sh-tools noprint" role="group" aria-label="Page settings">
    <button class="btn ghost" type="button" id="sh-smaller">Smaller text</button>
    <button class="btn ghost" type="button" id="sh-larger">Larger text</button>
    <button class="btn ghost" type="button" id="sh-easy" aria-pressed="false">Easier reading</button>
    <button class="btn ghost" type="button" id="sh-print">Print</button>
    <span class="hint" id="sh-saved" aria-live="polite"></span>
  </div>
  <details class="sh-disp noprint" id="sh-disp"><summary>Colours and reading</summary>
    <div class="sh-disp-grid">
      <label class="f">Colours<select id="sh-o-theme"><option value="auto">Match my device</option><option value="light">Light</option><option value="cream">Cream paper</option><option value="dark">Dark</option><option value="softdark">Soft dark</option></select></label>
      <label class="f">Contrast<select id="sh-o-contrast"><option value="auto">Match my device</option><option value="normal">Usual</option><option value="high">High contrast</option></select></label>
      <label class="f">Colour vision<select id="sh-o-cvd"><option value="usual">Usual colours</option><option value="rg">Hard to tell red from green</option><option value="by">Hard to tell blue from yellow</option></select></label>
      <label class="f">Letter shapes<select id="sh-o-font"><option value="atkinson">Atkinson Hyperlegible</option><option value="lexend">Lexend</option><option value="dyslexic">OpenDyslexic</option></select></label>
      <label class="f">Spacing<select id="sh-o-space"><option value="normal">Usual</option><option value="roomy">Roomy</option><option value="widest">Widest</option></select></label>
      <label class="f">Page tint (light pages)<select id="sh-o-tint"><option value="none">No tint</option><option value="blue">Blue</option><option value="green">Green</option><option value="peach">Peach</option></select></label>
      <label class="chk"><input type="checkbox" id="sh-o-plain"> One plain font for everything</label>
    </div>
    <p class="hint">These stay in this browser only.</p>
  </details>
  <div id="ps-sheet" class="ps-sheet sh-sheet"><p>Loading the sheet…</p></div>
  <p class="hint noprint sh-foot" id="sh-foot" hidden>Tick a box when a plant is done. Each tick is saved at once and shows up for the owner too. This page stops working the day after the last day on the sheet.</p>
</main>
<script src="/share/__TOKEN__/sitter-sheet.js"></script>
<script src="/share/__TOKEN__/share.js"></script>
</body>
</html>
